name: Build and Release Flutter Apps

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0, v2.1, etc.
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Rename APK for Release
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/C1_Hsch.apk
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: C1_Hsch.apk
          path: build/app/outputs/flutter-apk/C1_Hsch.apk

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build Windows
        run: flutter build windows --release
        
      - name: Zip Windows Release
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath C1_Hsch.zip
        
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: C1_Hsch.zip
          path: C1_Hsch.zip

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: C1_Hsch.apk
          
      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: C1_Hsch.zip
          
      - name: Get tag name or use default
        id: get_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=latest-build-${{ github.run_number }}" >> $GITHUB_ENV
          fi
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          repository: alshalabi011-dotcom/c1_hsch_downloads
          token: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: |
            C1_Hsch.apk
            C1_Hsch.zip
